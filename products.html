<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse our complete collection of electronics, clothing, home goods and books. Find the best deals at ShopEase.">
  <title>Products - ShopEase</title>

  <header>
    <div class="logo" onclick="location.href='index.html'">🛍️ ShopEase</div>
    <nav>

        <li><a href="products.html" class="active">Products</a></li>
