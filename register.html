<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your ShopEase account to start shopping for electronics, clothing, home goods and books.">
  <title>Register - ShopEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo" onclick="location.href='index.html'">🛍️ ShopEase</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="product-seo.html">Deals</a></li>
        <li><a href="checkout.html">Checkout</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="register.html" class="active">Register</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <div class="form-container">
      <h2 style="text-align:center;margin-bottom:30px;">Create Account</h2>
      
      <div id="message"></div>
      
      <form id="registerForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Choose a username" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Create a password" required>
          <div class="password-requirements">
            🔒 Password must be at least 8 characters
          </div>
        </div>
        
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
        </div>
        
        <button type="submit" class="btn" style="width:100%;justify-content:center;padding:14px;">Create Account</button>
      </form>
      
      <p style="text-align:center;margin-top:20px;color:#6b7280;">
        Already have an account? <a href="login.html" style="color:#6366f1;text-decoration:none;font-weight:600;">Login here</a>
      </p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ShopEase. All rights reserved. | Secure Payments | Free Shipping</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const messageDiv = document.getElementById('message');
      
      // Client-side validation
      if (password !== confirmPassword) {
        messageDiv.innerHTML = '<div class="error">✕ Passwords do not match!</div>';
        return;
      }
      
      if (password.length < 8) {
        messageDiv.innerHTML = '<div class="error">✕ Password must be at least 8 characters!</div>';
        return;
      }
      
      // Register using Auth module
      const result = Auth.register(username, email, password);
      
      if (result.success) {
        messageDiv.innerHTML = '<div class="success">✓ Registration successful! Redirecting to login...</div>';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } else {
        messageDiv.innerHTML = `<div class="error">✕ ${result.message}</div>`;
      }
    });
  </script>
</body>
</html>
