<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShopEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">🛍️ ShopEase</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="product-seo.html">Deals</a></li>
        <li><a href="checkout.html">Checkout</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <div class="form-container">
      <h2 style="text-align:center;margin-bottom:30px;">Login to ShopEase</h2>
      
      <div id="message"></div>
      
      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <input type="text" id="username" placeholder="Username or Email" required>
        </div>
        
        <div class="form-group">
          <input type="password" id="password" placeholder="Password" required>
        </div>
        
        <button type="submit" class="btn" style="width:100%;">Login</button>
      </form>
      
      <p style="text-align:center;margin-top:20px;">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ShopEase. All rights reserved. | Secure Payments | Free Shipping</p>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      
      try {
        const response = await fetch('login.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success) {
          messageDiv.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          messageDiv.innerHTML = `<div class="error">${result.message}</div>`;
        }
      } catch (error) {
        messageDiv.innerHTML = '<div class="error">An error occurred. Please try again.</div>';
      }
    });
  </script>
</body>
</html>
