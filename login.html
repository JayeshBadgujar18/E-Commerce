<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your ShopEase account to access your dashboard, orders, and wishlist.">
  <title>Login - ShopEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo" onclick="location.href='index.html'">🛍️ ShopEase</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="product-seo.html">Deals</a></li>
        <li><a href="checkout.html">Checkout</a></li>
        <li><a href="login.html" class="active">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <div class="form-container">
      <h2 style="text-align:center;margin-bottom:30px;">Login to ShopEase</h2>
      
      <div id="message"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" placeholder="Enter username or email" required>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn" style="width:100%;justify-content:center;padding:14px;">Login</button>
      </form>
      
      <p style="text-align:center;margin-top:20px;color:#6b7280;">
        Don't have an account? <a href="register.html" style="color:#6366f1;text-decoration:none;font-weight:600;">Register here</a>
      </p>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ShopEase. All rights reserved. | Secure Payments | Free Shipping</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('message');
      
      const result = Auth.login(username, password);
      
      if (result.success) {
        messageDiv.innerHTML = '<div class="success">✓ Login successful! Redirecting...</div>';
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      } else {
        messageDiv.innerHTML = `<div class="error">✕ ${result.message}</div>`;
      }
    });
  </script>
</body>
</html>
